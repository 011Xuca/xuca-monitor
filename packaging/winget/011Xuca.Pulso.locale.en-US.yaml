ShortDescription: 'Full PC monitoring from the tray: network latency, USB, in-game performance, Windows errors, hardware sensors and session recording.'
Description: |-
  Pulso watches the PC from the system tray and explains what happened and what to try: internet drops and lag (live ping and jitter),
  USB disconnects, FPS drops while gaming, black screens, blue screens and crashes, and CPU, GPU, memory and drive health
  (temperatures, clocks, power, VRAM, paging, NVMe/SATA/HDD type, SMART health and read/write speed).
  It includes a performance overlay and a timed session recorder that reports average FPS, 1% and 0.1% lows, frametimes,
  bottleneck analysis and a system diagnosis.
